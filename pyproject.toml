[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gait"
version = "0.1.0"
description = "Yürüyüş analizi ile nörodejeneratif hastalık sınıflandırma (PhysioNet gaitndd) – klinik karar destek prototipi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=12",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "requests>=2.31",
    "joblib>=1.3",
]

[project.optional-dependencies]
ml = ["optuna>=3.4", "shap>=0.44"]
dl = ["tensorflow>=2.15"]
app = ["streamlit>=1.30"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "pre-commit>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "contract: ekip üyelerinin teslimat sözleşmesi (uygulanmadıysa skip edilir)",
    "slow: uzun süren testler",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501", "B905"]
